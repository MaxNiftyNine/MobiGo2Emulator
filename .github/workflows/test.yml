name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libsdl2-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja sdl2 pkg-config
      - run: python3 scripts/assemble_firmware.py
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-python
      - shell: msys2 {0}
        run: python scripts/assemble_firmware.py
      - shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - shell: msys2 {0}
        run: cmake --build build --parallel
      - shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

